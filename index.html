    <style>
        /* --- SYSTEM FONT STACK --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #F2F2F7; /* Apple System Gray 6 */
            color: #1D1D1F;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Glassmorphism Puro */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Tarjetas iOS Interactivas */
        .ios-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(0,0,0,0.02);
            cursor: pointer;
        }
        .ios-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        /* Input Spotlight Gigante */
        .spotlight-input {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.08);
            outline: none;
            border-radius: 18px;
            font-size: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            transition: all 0.3s;
        }
        .spotlight-input:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
        }

        /* Onboarding Screen */
        #onboarding {
            transition: opacity 0.5s ease-out;
        }
        
        /* Animaciones */
        .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        // --- LÓGICA DE ONBOARDING ---
        function setMode(mode) {
            currentMode = mode;
            const onboarding = document.getElementById('onboarding');
            onboarding.style.opacity = '0';
            setTimeout(() => {
                onboarding.style.display = 'none';
            }, 500);
            
            updateInterfaceLabels();
            render(); // Re-renderizar si es necesario
        }

        function updateInterfaceLabels() {
            const texts = UI_TEXTS[currentMode];
            document.getElementById('mainTitle').innerHTML = texts.mainTitle;
            
            const badge = document.getElementById('modeBadge');
            badge.innerText = texts.badge;
            badge.className = `px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide border ml-2 ${texts.badgeColor}`;
        }

        // --- MOTOR DE BÚSQUEDA ---
        function render(filter = '') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const term = filter.toLowerCase().trim();

            const filtered = HEROES_DATA.filter(h => 
                (h.nombre && h.nombre.toLowerCase().includes(term)) || 
                (h.rol && h.rol.toLowerCase().includes(term)) ||
                (h.nickname && h.nickname.toLowerCase().includes(term)) ||
                (h.id && h.id.toLowerCase().includes(term))
            );

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 opacity-50">
                        <i data-lucide="search-x" class="w-16 h-16 mx-auto mb-4 text-gray-300"></i>
                        <p class="text-xl font-medium text-gray-400">Sin resultados</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach((h, index) => {
                const card = document.createElement('div');
                card.className = 'ios-card p-6 flex flex-col h-full group fade-in-up';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openModal(h);
                
                const icon = h.iconos ? h.iconos.split(' ')[0] : '👾';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="text-4xl group-hover:scale-110 transition-transform duration-300 filter grayscale group-hover:grayscale-0">${icon}</div>
                        ${h.is_meta ? '<span class="px-2 py-1 bg-black text-white text-[10px] font-bold rounded uppercase">Meta</span>' : ''}
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-1 tracking-tight">${h.nombre}</h3>
                    <p class="text-sm text-gray-500 font-medium mb-4">${h.rol}</p>
                    <div class="mt-auto pt-4 border-t border-gray-50 flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Ver Ficha</span>
                        <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // --- MODAL DINÁMICO ---
        function openModal(h) {
            const texts = UI_TEXTS[currentMode];

            // 1. Inyectar Textos de la Interfaz (Labels)
            document.getElementById('lblHeader').innerText = texts.header;
            document.getElementById('lblMechanic').innerText = texts.mechanic;
            document.getElementById('lblCounters').innerText = texts.counters;
            document.getElementById('lblItems').innerText = texts.items;
            document.getElementById('lblTips').innerText = texts.tips;
            document.getElementById('lblError').innerText = texts.error;

            // 2. Inyectar Datos del Héroe
            document.getElementById('mName').innerText = h.nombre;
            document.getElementById('mTitle').innerText = h.titulo || 'Héroe';
            document.getElementById('mIcon').innerText = h.iconos ? h.iconos.split(' ')[0] : '👾';
            
            // Descripción Core (Mecánica)
            document.getElementById('mPunish').innerText = h.mecanica_de_castigo || 'Sin datos.';
            
            // Traducción Mortal (Pro Play)
            document.getElementById('mTrans').innerText = `"${h.traduccion_mortal || 'Gana la línea.'}"`;
            
            // Noob Trap
            document.getElementById('mNoob').innerText = h.alerta_noob || 'Jugar sin pensar.';
            document.getElementById('mCombo').innerText = h.combo_basico || 'Básicos';
            
            const meta = document.getElementById('mMeta');
            if (h.is_meta) meta.classList.remove('hidden'); else meta.classList.add('hidden');

            // Renderizar Listas con Estilos Específicos
            
            // Counters (Rojos)
            const countersDiv = document.getElementById('mCounters');
            countersDiv.innerHTML = h.counters?.debil_contra?.map(c => 
                `<span class="px-3 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-bold border border-red-200">${c}</span>`
            ).join('') || '<span class="text-xs text-gray-400">N/A</span>';

            // Items (AMARILLOS - ADVERTENCIA)
            const itemsDiv = document.getElementById('mItems');
            itemsDiv.innerHTML = h.counters?.item_counters?.map(i => 
                `<span class="px-3 py-1 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold border border-amber-200 shadow-sm">${i}</span>`
            ).join('') || '<span class="text-xs text-gray-400">N/A</span>';

            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));
        
        // Inicializar iconos
        lucide.createIcons();
    </script>
